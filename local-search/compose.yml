name: natively-search
services:
  searxng:
    image: searxng/searxng@sha256:79180616c984f39524f6f27f19625a46f82c8ad4aa6a2e553db52b14e1b4a768
    network_mode: bridge
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./config/settings.yml:/etc/searxng/settings.yml:ro
      - ./runtime/docker-cache:/var/cache/searxng
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8888/
    restart: unless-stopped
